<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="savex-library" content="local">
  <meta name="theme-color" content="#f7f8f4">
  <meta name="description" content="Your Instagram saves and X bookmarks. One quiet place to find them again.">
  <title>saveXtension — your saves, together</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script src="/theme-init.js"></script>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <div id="app"><div class="boot">Opening your library…</div></div>
  <dialog id="modal"></dialog>
    <dialog id="sheet" aria-labelledby="sheet-title"></dialog>
  <dialog id="post-panel" aria-label="Post"></dialog>
  <aside class="notification-stack" aria-label="Notifications">
    <section id="sync-status" class="sync-toast" role="status" aria-live="polite" hidden></section>
    <div id="toast" role="status" aria-live="polite"></div>
  </aside>
</body>
</html>
