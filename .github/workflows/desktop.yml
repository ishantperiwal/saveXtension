name: Desktop installers
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e "if(process.env.GITHUB_REF_NAME !== 'v'+require('./package.json').version) throw new Error('Tag must match package.json version')"
      - run: npx install-electron --no
      - run: npx playwright install chromium
      - run: npm test
      - run: npm run test:desktop
      - run: npm run desktop:pack
      - run: npm run desktop:verify
      - name: Mac installer
        if: runner.os == 'macOS'
        run: npx electron-builder --config electron-builder.config.cjs --mac dmg
      - name: Windows installer
        if: runner.os == 'Windows'
        run: npx electron-builder --config electron-builder.config.cjs --win nsis --x64
      - uses: actions/upload-artifact@v4
        with:
          name: saveXtension-${{ runner.os }}
          path: |
            dist/desktop/*.dmg
            dist/desktop/*.exe
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: saveXtension-*
          merge-multiple: true
          path: installers
      - name: Publish tested installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [ -f "docs/releases/$RELEASE_TAG.md" ]; then
            gh release create "$RELEASE_TAG" installers/* --verify-tag --title "saveXtension $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md" --latest
          else
            gh release create "$RELEASE_TAG" installers/* --verify-tag --title "saveXtension $RELEASE_TAG" --generate-notes --latest
          fi
