name: Download page
on:
  push:
    branches: [main]
    paths: ['website/**', 'scripts/build-download-page.mjs', '.github/workflows/pages.yml', 'public/fonts/SpaceGrotesk*', 'public/favicon.svg']
  workflow_dispatch:
  workflow_run:
    workflows: ['Desktop installers']
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/configure-pages@v5
      - name: Resolve latest installers and build
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/build-download-page.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/downloads
      - uses: actions/deploy-pages@v4
        id: deployment
